# 1. Environment & Session
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# 2. Authentication Agent
exec-once = systemctl --user start hyprpolkitagent

# 3. Core Desktop Services
exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = hypridle                    # Auto sleep
#exec-once = nwg-dock-hyprland -p bottom -a center -i 56 -mb 6 -d -hd 0 -hl top -nolauncher -s style.css

# 4. Apps & Scripts
exec-once = wl-paste --watch cliphist store
exec-once = sleep 10 && cliphist list | tail -n +101 | cliphist delete

# --- AUTOSTART RICE DASHBOARD --- #
exec-once = sleep 2.5 && kitty --class kitty-jam tty-clock -c -b -C 2
exec-once = sleep 3 && kitty --class kitty-nvim nvim
exec-once = sleep 4.5 && kitty --class kitty-bawah
